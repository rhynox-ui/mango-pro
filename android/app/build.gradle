apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Real release signing — see keystore.properties.example for the
// template. android/keystore.properties is gitignored (a production
// signing key must never live in git history).
//
// FAILS CLOSED when it's missing. Ported from mango-mobile's own
// build.gradle after an audit flagged this exact repo's release
// buildType as always signingConfig signingConfigs.debug — the
// debug.keystore checked into this repo, whose password is the
// public, documented 'android'. An APK signed with it is an APK
// anyone can produce an "update" for, and Android's own update rule
// is exactly signature matching, so a debug-signed release build is
// one a stranger can push a replacement over. Silent is the dangerous
// part: the build succeeds, the APK installs and runs, and nothing
// anywhere says which key signed it.
//
// Debug-signed release builds are still genuinely useful (the
// existing android-debug-apk.yml workflow produces a standalone,
// Hermes-bundled sideload APK for real-device testing — there's no
// real release keystore secret configured for this repo yet), so this
// doesn't remove them. It makes them explicit: pass
// -PALLOW_DEBUG_SIGNED_RELEASE=true and the build proceeds with a
// loud warning.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def allowDebugSignedRelease = project.hasProperty('ALLOW_DEBUG_SIGNED_RELEASE') &&
    project.property('ALLOW_DEBUG_SIGNED_RELEASE').toString().toBoolean()

// Evaluated on the release task itself rather than at configuration
// time, so a plain `./gradlew assembleDebug` or an IDE sync on a
// checkout with no keystore still works untouched — only an actual
// release build is gated.
def assertReleaseSigningAllowed = {
    if (!hasReleaseKeystore && !allowDebugSignedRelease) {
        throw new GradleException(
            "Refusing to build a release variant with no android/keystore.properties.\n" +
            "It would be signed with the checked-in debug keystore (public password: 'android'),\n" +
            "which lets anyone publish an update over this app.\n\n" +
            "  To ship for real: create android/keystore.properties from keystore.properties.example.\n" +
            "  For a throwaway test APK: ./gradlew assembleRelease -PALLOW_DEBUG_SIGNED_RELEASE=true"
        )
    }
    if (!hasReleaseKeystore) {
        logger.warn("")
        logger.warn("*** WARNING: release variant is being signed with the DEBUG keystore. ***")
        logger.warn("*** Testing only. Do not distribute this build to users.             ***")
        logger.warn("")
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mangoprotocol.pro"
    defaultConfig {
        applicationId "com.mangoprotocol.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // Particle Auth (Google login) — read from android/gradle.properties
        // (blank by default; fill in real values from
        // https://dashboard.particle.network locally or via CI secrets).
        // @particle-network/rn-auth's own AndroidManifest.xml references
        // these placeholders directly (a pn${PN_APP_ID} URL scheme plus
        // three particle.network.* meta-data entries), auto-merged into
        // this app's manifest by Android's manifest merger.
        manifestPlaceholders = [
            PN_PROJECT_ID: project.findProperty('PN_PROJECT_ID') ?: '',
            PN_PROJECT_CLIENT_KEY: project.findProperty('PN_PROJECT_CLIENT_KEY') ?: '',
            PN_APP_ID: project.findProperty('PN_APP_ID') ?: ''
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// See assertReleaseSigningAllowed above. Matched on the task name so it
// covers assembleRelease and bundleRelease alike (and the per-ABI split
// variants the RN plugin generates), without needing a hardcoded list.
tasks.configureEach { task ->
    if (task.name ==~ /^(assemble|bundle|install|package).*Release$/) {
        task.doFirst { assertReleaseSigningAllowed() }
    }
}

// Particle's own compiled Android SDK (a transitive dependency of
// @particle-network/rn-auth-core/rn-base) pulls in a BouncyCastle
// artifact under its current "bcprov-jdk15to18" Maven coordinates,
// which collides with another dependency in this project's tree still
// on the older "bcprov-jdk15on" coordinates — same library, same
// classes, two different artifact names Gradle can't tell apart on the
// classpath. This is Android's own documented resolution for exactly
// this error class (see the classpath-sync-errors doc CI's own build
// log linked): exclude the older one everywhere so only one copy of
// BouncyCastle's classes ever reaches the classpath.
configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
