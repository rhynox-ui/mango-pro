name: Dependency audit

# Continuous advisory check on the dependencies that ship in the app
# (an uploaded audit's M-03). Separate from the APK workflows on purpose:
# it never blocks a build.
#
# Fails only on CRITICAL advisories in production dependencies. As of
# adding this, production has high-severity advisories with no safe fix:
#   - bigint-buffer (via @solana/spl-token) has no patched release;
#   - @coral-xyz/anchor / toml (via the pump.fun SDKs), where npm's
#     suggested "fix" is a breaking downgrade of those SDKs;
#   - image-size, which is React Native build tooling, not app runtime.
# The full report is printed on every run so new ones are visible, and a
# CycloneDX SBOM is kept for each run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full report (production dependencies)
        run: npm audit --omit=dev || true

      - name: Fail on critical advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Software bill of materials
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom.cdx.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
