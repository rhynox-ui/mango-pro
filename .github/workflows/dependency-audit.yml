name: Dependency audit

# Advisory check for dependencies that ship in the app.
# PRs and every main push get an immediate check; the weekly run remains
# as a backstop for dependency drift.
#
# npm currently reports several HIGH transitive advisories whose remediation
# requires breaking React Native / Solana / Pump / NEAR upgrades. Keep the
# complete production audit report, but block CI on CRITICAL advisories until
# those upstream dependency chains have compatible fixes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run repository verification suite
        run: npm run verify

      - name: Full report (production dependencies)
        run: npm audit --omit=dev || true

      - name: Fail on critical advisories
        run: npm audit --omit=dev --audit-level=critical

      - name: Software bill of materials
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom.cdx.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
