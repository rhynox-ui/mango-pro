name: Android release APK

# Builds a real, installable APK on every push to main (and on demand)
# and uploads it as a workflow artifact — the practical way to get a
# sideloadable build onto a real device for testing (Google login in
# particular needs a real device/emulator with Play Services; there's no
# way to produce or run that from this repo's own dev sandbox).
#
# Builds the `release` variant, NOT `assembleDebug` — a real device
# hit "Unable to load script" on the first debug APK this workflow
# produced: android/app/build.gradle's own react block documents why
# ("the list of variants that are debuggable... skip the bundling of the
# JS bundle and the assets. Default is 'debug', 'debugOptimized'"), so a
# debug APK expects to fetch JS from a live Metro dev server rather than
# carrying it, and there's no dev machine on the same network as a
# tester's phone for it to reach. `release` bundles the JS into the APK
# itself. android/app/build.gradle now fails closed on a release build
# with no android/keystore.properties (a security audit flagged the old
# unconditional signingConfigs.debug fallback -- debug.keystore's
# password is the public, documented 'android', so anyone could sign a
# replacement "update"), so this sideloaded test build passes the
# explicit -PALLOW_DEBUG_SIGNED_RELEASE=true opt-in below. There is no
# real release keystore secret configured for this repo yet -- a real
# production release needs one, but that's out of scope for a
# sideloaded test build.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # First run revealed ubuntu-latest does NOT ship sdkmanager on PATH
      # (that assumption was wrong) — this action installs the cmdline-
      # tools and sets ANDROID_HOME/ANDROID_SDK_ROOT.
      - uses: android-actions/setup-android@v3

      # Second run revealed hand-picking "platforms;android-37" here was
      # also wrong — that exact platform isn't in the SDK repository this
      # cmdline-tools version can see, and hardcoding a package string
      # here just drifts out of sync with android/build.gradle's own
      # compileSdkVersion/buildToolsVersion/ndkVersion the moment either
      # changes. Accept licenses up front and let the Android Gradle
      # Plugin auto-download exactly what IT asks for (on by default —
      # android.builder.sdkDownload) once ANDROID_HOME is set — the
      # standard, drift-proof way to do this in CI.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build release APK (bundles JS — no Metro needed on-device)
        working-directory: android
        # -PALLOW_DEBUG_SIGNED_RELEASE=true is the explicit opt-in
        # build.gradle now requires for a debug-signed release build —
        # see the file header comment above.
        run: ./gradlew assembleRelease --no-daemon -PALLOW_DEBUG_SIGNED_RELEASE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mango-pro-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
