name: Android release APK

# Manual release/sideload build. Android release builds are intentionally
# not run on every main push because they install the Android SDK/NDK and
# perform two full Gradle builds (APK + AAB).

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android NDK r28
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: npm ci

      - name: Configure release signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          cat > keystore.properties << PROPS
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEYSTORE_PASSWORD
          PROPS

      - name: Read app version
        id: pkgver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build release APK (sideload-testable, bundles JS)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=${{ steps.pkgver.outputs.version }} -PALLOW_DEBUG_SIGNED_RELEASE=true

      - name: Build release AAB (for Google Play Console upload)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=${{ steps.pkgver.outputs.version }} -PALLOW_DEBUG_SIGNED_RELEASE=true

      - name: Upload APK (sideload testing)
        uses: actions/upload-artifact@v4
        with:
          name: mango-pro-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB (Google Play Console upload)
        uses: actions/upload-artifact@v4
        with:
          name: mango-pro-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkgver.outputs.version }}-${{ github.run_number }}
          name: Mango Pro v${{ steps.pkgver.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
