name: Android debug APK

# Builds a real, installable debug APK on every push to main (and on
# demand) and uploads it as a workflow artifact — the practical way to
# get a sideloadable build onto a real device for testing (Google login
# in particular needs a real device/emulator with Play Services; there's
# no way to produce or run that from this repo's own dev sandbox).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # First run revealed ubuntu-latest does NOT ship sdkmanager on PATH
      # (that assumption was wrong) — this action installs the cmdline-
      # tools and sets ANDROID_HOME/ANDROID_SDK_ROOT.
      - uses: android-actions/setup-android@v3

      # Second run revealed hand-picking "platforms;android-37" here was
      # also wrong — that exact platform isn't in the SDK repository this
      # cmdline-tools version can see, and hardcoding a package string
      # here just drifts out of sync with android/build.gradle's own
      # compileSdkVersion/buildToolsVersion/ndkVersion the moment either
      # changes. Accept licenses up front and let the Android Gradle
      # Plugin auto-download exactly what IT asks for (on by default —
      # android.builder.sdkDownload) once ANDROID_HOME is set — the
      # standard, drift-proof way to do this in CI.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mango-pro-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
